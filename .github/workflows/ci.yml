name: CI — SDKs & Solana SBF Program

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sdk:
    name: Python SDK & Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package in editable mode
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run Python unit & binary codec tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI entrypoints
        run: |
          solana-order-fee --help
          solana-order-verify --help

  typescript-sdk:
    name: TypeScript / ESM SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run zero-dependency ESM SDK test suite
        run: npm --prefix sdk-ts test

  rust-sbf-program:
    name: Rust SBF Program (ValidatorOrderRegistry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/validator-order-registry
      - name: Run native Rust unit tests
        run: cargo test --manifest-path programs/validator-order-registry/Cargo.toml
      - name: Install Anza / Agave SBF toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build Solana SBF binary (validator_order_registry.so)
        run: |
          cargo build-sbf --manifest-path programs/validator-order-registry/Cargo.toml
          ls -lh programs/validator-order-registry/target/deploy/validator_order_registry.so
          sha256sum programs/validator-order-registry/target/deploy/validator_order_registry.so
      - name: Upload compiled SBF binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: validator-order-registry-sbf
          path: programs/validator-order-registry/target/deploy/validator_order_registry.so
          retention-days: 90
